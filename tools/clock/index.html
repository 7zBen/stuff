<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clock</title>
  <meta name="description" content="A full-screen live clock." />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Ccircle cx='8' cy='8' r='4.2' fill='none' stroke='%236ea8ff' stroke-width='1.5'/%3E%3Cpath d='M8 5.2V8l2 1.4' fill='none' stroke='%236ea8ff' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115;
      --text: #e8edf5;
      --muted: #8b95a8;
      --accent: #6ea8ff;
      --line: #2a3140;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(1200px 600px at 20% -10%, #1d2a44 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 110%, #1a2438 0%, transparent 50%),
        var(--bg);
    }
    .bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; color: var(--muted); font-size: 13px;
    }
    .bar a { color: var(--muted); text-decoration: none; }
    .bar a:hover { color: var(--accent); }
    .bar button {
      appearance: none; background: transparent; border: 1px solid var(--line);
      color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .stage { flex: 1; display: grid; place-items: center; padding: 24px 20px 48px; text-align: center; }
    .time {
      font-variant-numeric: tabular-nums;
      font-weight: 560;
      letter-spacing: -.04em;
      font-size: clamp(64px, 16vw, 180px);
      line-height: .95;
      margin: 0;
    }
    .secs { font-size: .38em; letter-spacing: 0; color: var(--muted); font-weight: 500; }
    .date { margin: 18px 0 0; color: var(--muted); font-size: clamp(16px, 2.4vw, 26px); }
    html[data-theme="light"] body {
      background:
        radial-gradient(1200px 600px at 20% -10%, #d7e3f6 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 110%, #e6edf8 0%, transparent 50%),
        var(--bg);
    }
  </style>
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
</head>
<body>
  <div class="bar">
    <a href="../../">← Home</a>
    <button type="button" id="fmt">24-hour</button>
  </div>
  <div class="stage">
    <div>
      <p class="time" id="time">00:00<span class="secs" id="secs">00</span></p>
      <p class="date" id="date"></p>
    </div>
  </div>
  <script>
    (function () {
      const timeEl = document.getElementById("time");
      const secsEl = document.getElementById("secs");
      const dateEl = document.getElementById("date");
      const fmtBtn = document.getElementById("fmt");
      let hour12 = localStorage.getItem("clock-12") === "1";

      function pad(n) { return String(n).padStart(2, "0"); }

      function tick() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = pad(now.getMinutes());
        const seconds = pad(now.getSeconds());
        let suffix = "";
        if (hour12) {
          suffix = hours >= 12 ? " pm" : " am";
          hours = hours % 12 || 12;
        }
        timeEl.childNodes[0].textContent = (hour12 ? String(hours) : pad(hours)) + ":" + minutes;
        secsEl.textContent = seconds + suffix;
        dateEl.textContent = now.toLocaleDateString(undefined, {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
        fmtBtn.textContent = hour12 ? "12-hour" : "24-hour";
      }

      fmtBtn.addEventListener("click", function () {
        hour12 = !hour12;
        localStorage.setItem("clock-12", hour12 ? "1" : "0");
        tick();
      });

      tick();
      setInterval(tick, 250);
    })();
  </script>
</body>
</html>
